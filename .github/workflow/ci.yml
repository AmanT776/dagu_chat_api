name: "ci"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

lint-and-format:
  name: Style
  runs-on: ubuntu@latest

  steps:
    - name: Checkout code
      uses: actions/Checkout@v5

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.26.0"

    - name: install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: run staticcheck
      run: staticcheck ./...

    - name: Format code
      run: test -z $(go fmt ./...)
